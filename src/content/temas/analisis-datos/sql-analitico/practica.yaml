# Los resultados se calcularon con la tabla ventas del tema (12 filas) en SQLite 3.45 (misma semántica de ventanas):
#   total por región: Centro 2500 (3 ventas), Norte 4300 (5), Sur 4500 (4) ; HAVING sum > 4000 -> Norte y Sur
#   ranking vendedores: Centro Eva 1800 / Fabi 700 ; Norte Ana 2700 / Bruno 1600 ; Sur Diego 2400 / Carla 2100
#   Norte montos DESC: 1200, 1000, 800, 800, 500 -> rank 1,2,3,3,5 ; dense_rank 1,2,3,3,4 ; row_number 1..5
#   acumulado Norte por fecha: 1200, 2000, 3000, 3800, 4300
#   acumulado global (marco por defecto): 27/03 -> 8600 en las dos filas (7200 + 800 + 600)
#   promedio móvil 3 filas (por fecha), 5.ª fila: (1500 + 900 + 1000) / 3 = 1133.33 ; promedio de las 5 = 1080
tarjetas:
  - id: t-group-by-colapsa
    frente: ¿Qué hace GROUP BY con las filas de cada grupo?
    dorso: Las colapsa en una sola fila por grupo, así que el detalle de cada fila se pierde.
    fuente: pg-agrupar
  - id: t-ventana-conserva-filas
    frente: ¿Qué diferencia a una función de ventana de un agregado con GROUP BY?
    dorso: Que cada fila conserva su identidad, así que salen tantas filas como entraron.
    fuente: pg-ventana
  - id: t-over-define-ventana
    frente: ¿Qué cláusula convierte a `sum` o `avg` en una función de ventana?
    dorso: La cláusula `OVER`.
    fuente: pg-ventana
  - id: t-partition-by-omitido
    frente: ¿Qué pasa si una función de ventana no lleva `PARTITION BY`?
    dorso: Toda la tabla es una única partición.
    fuente: pg-ventana
  - id: t-where-vs-having
    frente: ¿Cuál es la diferencia entre WHERE y HAVING?
    dorso: WHERE filtra filas antes de agrupar; HAVING filtra grupos después de calcular los agregados.
    fuente: pg-agrupar
  - id: t-ventana-no-en-where
    frente: ¿En qué cláusulas se permiten las funciones de ventana y por qué no en WHERE?
    dorso: Solo en SELECT y en ORDER BY, porque se ejecutan después de WHERE, GROUP BY y HAVING.
    fuente: pg-ventana
  - id: t-top-n-subconsulta
    frente: ¿Cómo te quedás con las dos mejores filas de cada grupo?
    dorso: Calculás la posición con `row_number()` en una subconsulta y filtrás `pos <= 2` en la consulta de afuera.
    fuente: pg-ventana
  - id: t-rank-hueco
    frente: Dos filas empatan en el primer puesto. ¿Qué número recibe la siguiente con `rank()` y con `dense_rank()`?
    dorso: Con `rank()` recibe el 3 (deja hueco); con `dense_rank()` recibe el 2.
    fuente: pg-funciones
  - id: t-row-number-desempate
    frente: ¿Qué pasa con `row_number()` cuando dos filas empatan en el ORDER BY?
    dorso: Les da números distintos pero el orden entre ellas es arbitrario, salvo que agregues un criterio de desempate.
    fuente: pg-funciones
  - id: t-marco-por-defecto
    frente: Una suma con ORDER BY y sin marco explícito, ¿hasta dónde llega para cada fila?
    dorso: Hasta la fila actual y todas las que empatan con ella en el ORDER BY.
    fuente: pg-sintaxis
  - id: t-lag-primera-fila
    frente: ¿Qué devuelve `lag(monto)` en la primera fila de una partición?
    dorso: Devuelve `NULL`, porque no hay fila anterior (a menos que le pases un valor por defecto).
    fuente: pg-funciones

ejercicios:
  - id: e-filas-con-ventana
    tipo: numerico
    enunciado: |
      La tabla `ventas` tiene 12 filas y 3 regiones distintas. ¿Cuántas filas devuelve esta consulta?

      ```
      SELECT region, monto, sum(monto) OVER (PARTITION BY region) AS total_region
      FROM ventas;
      ```
    respuesta: 12
    tolerancia:
      absoluta: 0
    unidad: filas
    explicacion: |
      La función de ventana no colapsa filas: cada fila de entrada produce una fila de salida con una columna extra. Con `GROUP BY region` habrían salido 3.
    erroresComunes:
      - valor: 3
        explicacion: Ese sería el resultado de un `GROUP BY region`. Con `OVER` las filas se conservan.
    fuente: pg-ventana
  - id: e-rank-con-empate
    tipo: numerico
    enunciado: |
      Las ventas del Norte, de mayor a menor monto, son 1200, 1000, 800, 800 y 500. Con `rank() OVER (ORDER BY monto DESC)`, ¿qué puesto recibe la venta de 500?
    respuesta: 5
    tolerancia:
      absoluta: 0
    unidad: ""
    explicacion: |
      Las dos de 800 empatan en el puesto 3. `rank()` deja un hueco después de un empate, así que la siguiente fila recibe el puesto 5. Con `dense_rank()` recibiría el 4.
    erroresComunes:
      - valor: 4
        explicacion: Ese es el valor de `dense_rank()`, que no deja hueco. La consulta usa `rank()`.
    fuente: pg-funciones
  - id: e-acumulado-fila
    tipo: numerico
    enunciado: |
      Las ventas del Norte, ordenadas por fecha, son 1200 (02/03), 800 (05/03), 1000 (15/03), 800 (27/03) y 500 (31/03). Con una suma acumulada por fecha sobre el Norte, ¿qué valor muestra la fila del 27/03?
    respuesta: 3800
    tolerancia:
      absoluta: 0
    unidad: miles de pesos
    explicacion: |
      Se suma desde la primera venta hasta la actual: $1200 + 800 + 1000 + 800 = 3800$. La venta del 31/03 todavía no cuenta.
    erroresComunes:
      - valor: 4300
        explicacion: Ese es el total de la región, o sea el acumulado de la última fila.
    fuente: pg-ventana
  - id: e-promedio-movil
    tipo: numerico
    enunciado: |
      Las primeras cinco ventas de la tabla, ordenadas por fecha, tienen estos montos: 1200, 800, 1500, 900 y 1000. Se calcula `avg(monto) OVER (ORDER BY fecha ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)`. ¿Qué valor sale en la quinta fila? Redondeá a dos decimales.
    respuesta: 1133.33
    tolerancia:
      absoluta: 0.05
    unidad: miles de pesos
    explicacion: |
      El marco de la quinta fila abarca ella y las dos anteriores: 1500, 900 y 1000. El promedio es $(1500 + 900 + 1000)/3 = 1133{,}33$.
    erroresComunes:
      - valor: 1080
        explicacion: Ese es el promedio de las cinco filas, como si el marco empezara en la primera.
    fuente: pg-sintaxis
  - id: e-top2-por-region
    tipo: opcion-multiple
    enunciado: Querés las dos ventas de mayor monto de cada región. ¿Cuál es la forma correcta en PostgreSQL?
    opciones:
      - texto: Poner `WHERE row_number() OVER (PARTITION BY region ORDER BY monto DESC) <= 2`.
        explicacion: Las funciones de ventana no se permiten en WHERE; la consulta da error.
      - texto: Calcular `row_number()` con `PARTITION BY region` en una subconsulta y filtrar `pos <= 2` afuera.
        correcta: true
        explicacion: Es el patrón del manual de PostgreSQL. La ventana se calcula adentro y el filtro se aplica sobre su resultado afuera.
      - texto: Usar `GROUP BY region HAVING row_number() <= 2`.
        explicacion: HAVING tampoco admite funciones de ventana, y además GROUP BY colapsaría las ventas en una fila por región.
      - texto: Usar `SELECT region, max(monto) FROM ventas GROUP BY region`.
        explicacion: Devuelve solo la mayor venta por región, no las dos mejores.
    fuente: pg-ventana
  - id: e-acumulado-empatadas
    tipo: opcion-multiple
    enunciado: En `sum(monto) OVER (ORDER BY fecha)`, las dos ventas del 27/03 (800 y 600) muestran el mismo acumulado, 8600. ¿Por qué?
    opciones:
      - texto: Es un error de la base cuando hay dos filas con la misma fecha.
        explicacion: No es un error; es el comportamiento documentado.
      - texto: El marco por defecto incluye a todas las filas empatadas con la actual en el ORDER BY.
        correcta: true
        explicacion: Para cada una de las dos filas del 27/03, el marco llega hasta la última empatada. Por eso las dos ven 7200 + 800 + 600 = 8600.
      - texto: Falta un PARTITION BY.
        explicacion: PARTITION BY no cambia el tratamiento de los empates dentro de una partición.
      - texto: La función sum ignora la segunda fila repetida.
        explicacion: sum no descarta filas. Las dos aportan su monto.
    fuente: pg-sintaxis
  - id: e-vf-ventana-en-where
    tipo: verdadero-falso
    enunciado: En PostgreSQL podés usar una función de ventana directamente en la cláusula WHERE.
    respuesta: false
    justificacion: Solo se permiten en el SELECT y en el ORDER BY, porque se ejecutan después de WHERE, GROUP BY y HAVING. Para filtrar por su resultado hace falta una subconsulta.
    fuente: pg-ventana
  - id: e-vf-mismas-filas
    tipo: verdadero-falso
    enunciado: "`SELECT region, sum(monto) FROM ventas GROUP BY region` y `SELECT region, sum(monto) OVER (PARTITION BY region) FROM ventas` devuelven la misma cantidad de filas."
    respuesta: false
    justificacion: La primera devuelve una fila por región. La segunda devuelve una fila por cada venta, con el total de su región repetido.
    fuente: pg-ventana

problemas:
  - id: p-pg-tutorial-ventanas
    enunciado: Creá la tabla `ventas` del tema en un PostgreSQL local (puede ser en un contenedor o instalado) y reproducí los ejemplos del tutorial adaptados a tu tabla. Después escribí tres consultas propias con `PARTITION BY`, una con `rank()` y una con `lag()`, y anotá qué fila cambia si agregás un empate.
    fuente: pg-ventana
    ubicacion: §3.5 (tutorial) y §9.22 (funciones de ventana)
    url: https://www.postgresql.org/docs/current/tutorial-window.html
    dificultad: intermedio
  - id: p-pg-marco
    enunciado: Con la tabla `ventas`, escribí el acumulado por región con el marco por defecto y otra vez con `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`. Agregá una venta del Norte con la misma fecha que otra y explicá por qué los acumulados difieren.
    fuente: pg-sintaxis
    ubicacion: §4.2.8 (Window Function Calls, marco por defecto)
    url: https://www.postgresql.org/docs/current/sql-expressions.html
    dificultad: avanzado
  - id: p-emc-ranking
    enunciado: Reproducí el ranking dentro de cada categoría del libro con tu propia tabla. Primero calculá el total por grupo con GROUP BY en una subconsulta y después aplicá `rank()` con `PARTITION BY`. Comparalo con la versión de una sola consulta del tema, que usa `sum` dentro del `OVER`.
    fuente: emc-ds
    ubicacion: cap. 11, §11.3.1 (Window Functions), pp. 343-344
    dificultad: intermedio
