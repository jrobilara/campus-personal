problemas:
  - id: p-stewart-gradiente-evaluado
    enunciado: |
      Del conjunto de ejercicios 7 a 10 de la sección 14.6, elegí dos funciones. Para cada una calculá el gradiente, evalualo en el punto $P$ que pide el ejercicio y verificá a mano con un cociente incremental ($h = 0{,}0001$ en una planilla o en Python) que la derivada parcial que calculaste es correcta. Anotá en una línea hacia dónde apunta el gradiente en $P$.
    fuente: stewart-multi
    ubicacion: cap. 14, §14.6, ejercicios 7-10 (p. 943)
    dificultad: intermedio
  - id: p-mml-puntos-estacionarios
    enunciado: |
      Para $f(x) = x^3 + 6x^2 - 3x - 5$, hallá los puntos estacionarios y clasificalos (mínimo, máximo o silla). Después escribí un descenso por gradiente de unas diez líneas en Python o en una planilla y corrélo con tasa 0,01 desde $x_0 = 0$ y desde $x_0 = -5$. Contá qué pasa en cada caso y por qué.
    fuente: mml
    ubicacion: cap. 7, ejercicio 7.1 (p. 247); algoritmo en §7.1
    dificultad: intermedio
  - id: p-planilla-mse
    enunciado: |
      En una planilla, cargá los tres puntos del ejercicio del error cuadrático medio y armá el descenso por gradiente de $E(w)$ columna por columna (w, gradiente, nuevo w, error). Corré 30 filas con tasas 0,01, 0,05, 0,15 y 0,25. Compará con el valor exacto $w^* = \frac{\sum n_i t_i}{\sum n_i^2}$ y anotá cuál de las tres primeras llega más rápido y cuál tasa no converge. Para este error, el factor por paso es $1 - \gamma \cdot 28/3$: calculá a partir de qué tasa deja de converger y comprobalo.
    fuente: mml
    ubicacion: §7.1 y ejemplo 7.2 (pp. 228-230)
    dificultad: intermedio
